<!DOCTYPE html>

<head>

<title>Hi, Azka.</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a1428;--bg2:#12284d;--card:rgba(20,40,78,.72);--ink:#f3f8ff;--soft:#a9c9ee;--blue:#8ec5ff;--line:rgba(142,197,255,.28);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(800px circle at var(--mx,50%) var(--my,30%),var(--bg2),var(--bg) 65%);color:var(--ink);font-family:'Lora',Georgia,serif;line-height:1.8;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.scr.on{display:flex;animation:in .9s ease}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:.1em 0;color:var(--blue)}
h1{font-size:clamp(3rem,13vw,5.5rem);font-weight:500;letter-spacing:.01em}
.sub{color:var(--soft);font-style:italic;margin:0 0 1.8em;max-width:30ch}
.kick{font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;color:var(--soft);margin-bottom:.4em}

.btn{font:inherit;font-size:.95rem;letter-spacing:.08em;color:var(--ink);background:transparent;border:1px solid var(--blue);border-radius:2px;padding:.7em 1.8em;cursor:pointer;transition:background .25s}
.btn:hover{background:rgba(142,197,255,.14)}
.btn.ghost{border-color:transparent;color:var(--soft)}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:2px;width:0;background:var(--blue);transition:width .5s;z-index:5}
.card{width:100%;max-width:640px;max-height:calc(100% - 110px);overflow-y:auto;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:3px;padding:1.8em 1.7em;text-align:left;font-size:1.02rem;line-height:1.9}
.card::-webkit-scrollbar{width:4px}.card::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.tag{font-family:'Cormorant Garamond',Georgia,serif;color:var(--blue);font-style:italic;font-size:1.15rem;margin:0 0 .5em}
.nav{display:flex;gap:12px;align-items:center;margin-top:18px}
.cnt{color:var(--soft);font-size:.85rem;min-width:56px}

.fx{position:fixed;pointer-events:none;width:11px;height:16px;border-radius:70% 0 70% 0;opacity:.85;animation:up 2.8s ease-in forwards;z-index:9}
@keyframes up{to{transform:translateY(60vh) rotate(200deg);opacity:0}}
.fin p{max-width:34ch;color:var(--soft)}
@media (prefers-reduced-motion:reduce){.env,.scr.on{animation:none}}
.card.wide{max-width:900px}
.duo{display:grid;grid-template-columns:190px 1fr;gap:1.6em;align-items:start}
.duo.rv{grid-template-columns:1fr 190px}.duo.rv .phs{order:2}
.phs{display:flex;flex-direction:column;gap:1.2em;position:sticky;top:0}
.pol{background:#f3f8ff;padding:7px;border-radius:2px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.pol img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
@media (max-width:640px){.duo,.duo.rv{grid-template-columns:1fr}.duo.rv .phs{order:0}.phs{flex-direction:row;justify-content:center;position:static}.phs .pol{width:44%}}
</style>
</head>

<section class="scr fin" id="s2">
  <h2 style="font-size:clamp(2rem,8vw,3.2rem)">Selamat Anniversary Kedua</h2>
  <p>my home, my universe. Azure: ketenangan, kepercayaan, dan harapan.</p>
  <div style="height:1em"></div>
  <button class="btn" id="bloom">Tabur kelopaknya</button>

<script>
var T=[
["Awal","Hi, Sayang? Azka? Apa pun panggilannya, itu nggak terlalu penting. Ini hampir anniversary kedua kita: bulan ketika kita pertama kali jatuh cinta, tanggal ketika komitmen kita dibuat."],
["Ceritanya dulu","I don’t even know if I’m in the right place to say this, but here the story goes first. A lot, like literally a lot, is happening in her life. She might not be the flower of his eyes today, or at the very least she still hopes she was. She just wants him to know that every step of her being since that day will always remain her deepest regret. She means it. It might still be her, Raara, and so on, but the kind of person she is, indeed, is not the same. She misses him so, so badly that she couldn’t keep it to herself. Words might not convince you as a pledge, so let actions do it. She just wants him to feel and know how deeply serious she is about this relationship. She stays, and stays, and stays, and becomes the person he always wanted, just so everything could still happen. Dia lebih dari sekadar minta maaf untuk segala hal yang salah, menyakitkan, toxic, dan bodoh, dari yang disengaja sampai yang tidak disengaja. She brings him her deepest sorry, so please acknowledge it, Azka. She has told him before, didn’t she, she doesn’t have any reason to love him, so how could she have any reason to hate and leave him. She can’t. He knows that she can’t. It’s always been him. She drinks and she thinks of him, she eats and she thinks of him, she drives and she thinks of him. God probably has a friend in her mind to stay with, haha. Everything she does always resembles him. Every corner of this city, the places they went to, they haunt her so much that she knows she can barely move on from him, and she doesn’t want to. If time could heal, she’d prefer not to be healed and bear the wounds wherever she goes. And if she could ever be happier than ever, it must be the time he is safe and sound in her arms. She always wanted the best for her man. It might sound wrong to him, but she means it. She is so careless that she always spat out meaningless words to her man, until he couldn’t believe her any longer. She feels shame enough that she didn’t mean it."],
["Terima kasih","I know it doesn’t have to be today, since I told you it’s our almost-anniversary. The genuine reason is that I just can’t hold it in any longer. For everything we did, dari SMA sampai sekarang, it all matters to me. Thank you for always being a great lover. Thank you for always staying and never giving up on me, at the very least until now. Terima kasih untuk selalu jadi punggung tempatku bersandar, pendengar di setiap jalan ceritaku, dan pendamping yang membimbing dan menuntunku menjadi diriku yang sekarang. Thank you for every meal you paid for, every thing, every gift that cost you your own money. Thank you for always spending time with me in your busy schedule every night, menemaniku di DC, cerita, atau sleepcall yang bikin HP-mu panas. I’m sorry it broke. Thank you for every piece of your mind, your veins, blood, anger, love, and every emotion that brought us here, everything unnoticed that you’ve spent on me. I appreciate everything you’ve done, even if it only meant breathing and answering my texts. Terima kasih. We have our own time and sound, so until the very last one drops, please don’t let go any sooner."],
["Maaf","Sekarang, di detik-detik ketika dadaku terasa sesak hingga sulit bernapas, aku sadar air mata nggak akan pernah cukup buat bayar semua lelah yang udah kamu tanggung sendirian. I know I broke you. I know I pushed you to the very edge where staying with me feels like a punishment instead of a safe space. Maaf ya, Sayang. Maaf kalau selama ini caraku mencintaimu justru jadi hal paling menyakitkan yang harus kamu hadapi. Kamu sudah menyerah, kamu bilang kamu capek, dan bagian paling menyakitkan dari semua ini adalah: aku paham betul kenapa kamu sampai di titik itu. I don’t even have the right to beg you to stay if it only hurts you more. Tapi ya Tuhan, rasanya sakit sekali membayangkan duniaku berjalan tanpa kamu di dalamnya. When a broken soul is washed ashore, who am I to ask for more, more and more. Jujur saja, dan ini bukan pembelaan lagi, karena semua hal yang aku lakukan nggak ada yang cukup untuk dibela, kan? Bukan rasa takut kehilangan “posisi aman” atau tempat bersandar yang membuatku sebegitu memohon padamu hari ini. Bukan. It is never about my comfort zone. Aku menangis bukan karena kehilangan orang yang biasa memanjakanku atau menemani hariku. Aku menangis karena aku baru benar-benar sadar cara menjadi perempuan yang cukup, cara mencintai dengan benar, cara menghargai setiap debar napasmu… tapi waktu kita malah habis di saat aku baru belajar memahaminya. Isn’t it ironic? Aku baru jadi rumah yang nyaman buat kamu, pas pintunya sudah terlanjur kamu tutup rapat-rapat. Setiap sudut kota ini mendadak jadi saksi bisu yang kejam, Azka. Jalan-jalan, lorong-lorong sekolah tempat kita dulu sering mencuri waktu untuk ngobrol berdua, tempat-tempat yang dulu kita datangi, lagu-lagu yang biasa kita dengar di mobilmu, aroma parfum yang sering kamu pakai, makanan dan minuman yang sering kita pesan. They all scream your name. It haunts me to my bones. Kalau ada pilihan antara sembuh dari rasa sakit ini atau tetap membawa luka ini ke mana-mana sambil mengingatmu, I’d choose the wounds over healing, any single day. Karena melupakanmu rasanya seperti mencabut separuh nyawa dari ragaku sendiri. And no, I don’t want to move on. Aku ingin terus di sini, merawat sisa-sisa kenangan kita dari masa putih abu-abu sampai sekarang, berharap malaikat kecil di pikiranmu masih berbisik namaku di sela sibuknya harimu."],
["Janji kita","Please, if you can’t find a single shred of belief left in me, kalau kamu sudah tidak lagi percaya pada omong kosong atau air mataku, kumohon, percayalah pada janji yang pernah kita ikrarkan bersama sejak MAN dulu. Ingat sumpah-sumpah kecil kita di balik seragam putih abu, prinsip tentang hubungan serius yang dulu aku dan kamu bangun mati-matian dari nol, bertahan melewati ribuan perselisihan hingga detik ini. Let that promise be the anchor. Bukan karena aku yang meminta, tapi karena aku tahu betapa berharganya arti komitmen itu. I am begging you, let that be the reason you hold on, at least one last time, just until my heart can truly accept how to let you go gracefully. Karena saat ini, aku sama sekali belum siap. I am so deeply, desperately not ready."],
["Buket Azure","Dan untuk buket bunga yang ada di hadapanmu sekarang… look at it, please? I thought day and night, right from the start of November, about what could bring Sayang any warmth, and I couldn’t stop being so excited about it. For everything that happened, I entrusted you with this loving thing. It might not be much, but hey, listen. It’s called Azure, find it familiar? It symbolizes tranquility, trust, and hope. I give you this calmness and my deep serenity through the theme, hehe, hope you like it! Aku sengaja memilih tema Azure ini, rangkaian warna biru yang melambangkan ketenangan, kepercayaan, dan harapan yang belum sepenuhnya mati di hatiku, mengingatkan pada langit cerah di hari-hari awal kita berani bermimpi bersama. I spent days thinking about what could possibly bring even a little warmth to your cold days, and this is what my broken heart could offer. Mungkin bunga ini tidak bisa menghapus luka yang tercipta, tapi semoga ia bisa menyampaikan setidaknya sebagian kecil dari rasa bersalah dan ketulusan masa remaja kita yang tumbuh dewasa bersama, yang tidak bisa lagi diungkapkan oleh kata-kataku yang sudah terlanjur kehilangan makna di matamu."],
["Doaku","Kalaupun hari ini kamu tetap bersikeras ingin melepaskan tanganmu dari genggamanku, I want you to know that my ultimate prayer is no longer just about keeping you for myself. Kalau pada akhirnya kebahagiaanmu menuntutku untuk pergi, aku sedang belajar, Azka. Belajar memohon kepada semesta bukan agar kamu tetap di sini, tapi agar kamu disembuhkan dari segala lelah dan luka yang kubawa ke dalam hidupmu. Your peace indeed matters way more than my broken heart. Kalau kehadiranku selama ini hanya menjadi duri di harimu, aku ikhlas… sungguh, aku sedang mencoba berdamai dengan keikhlasan itu, walau rasanya separuh jiwaku ikut tercabut. Aku cuma ingin kamu tahu, tujuanku sekarang bukan lagi memaksa kita bertahan dengan cara yang salah, tapi membuktikan bahwa perempuan yang tadinya egois sudah sepenuhnya rela melakukan apa saja, bahkan merelakan egonya sendiri setiap waktu, asal kamu bisa bernapas tanpa beban, asal kamu bisa kembali menemukan senyummu yang sempat hilang karena aku. Mungkin aku memang sudah tidak lagi berguna sebagai tempatmu bersandar, mungkin aku sudah kehilangan hak untuk disebut rumah bagimu. And it hurts like hell, tapi biarlah aku memikul sisa rasa sakit ini sendirian. Kalau kamu butuh ruang untuk sembuh, take all the time you need. Aku tidak meminta posisimu kembali begitu saja. Aku hanya ingin kamu melihat kesungguhan di balik mataku yang basah ini, bahwa setelah semua salah yang aku perbuat, satu-satunya hal yang paling aku inginkan di dunia ini adalah melihatmu baik-baik saja, bahkan jika itu artinya aku harus berdiri di garis paling belakang hidupmu. I am trying so hard to let go of my selfishness, just to hold onto the genuine wish for your happiness. Jadi, kalaupun hari ini atau esok kamu benar-benar melangkah pergi meninggalkanku, bawalah keyakinan bahwa Raara yang ada bersamamu sekarang benar-benar tulus mencintaimu lebih dari dia mencintai dirinya sendiri."],
["Untuk hari ini","Wait, hold… just for today. Kalau kamu mau melangkah, kalau kamu merasa kita sudah benar-benar usai, kumohon tahan langkahmu setidaknya untuk hari ini. Look around, Azka. Hari ini seharusnya menjadi hari di mana kita merayakan dua tahun perjalanan kita. Dua tahun kita bergandengan, menertawakan hal-hal bodoh, bertahan melewati kerasnya dunia, dan menjadi rumah bagi satu sama lain. Kita masih di sini, masih terikat dalam satu nama, dalam satu status yang kita bangun sejak masih berseragam putih abu. We are still us. Hubungan kita belum benar-benar mati di hadapan semesta, setidaknya tidak sebelum hari istimewa ini. So please, reconsider it, just for today. Jangan cabut namaku dari hatimu di hari yang harusnya jadi milik kita berdua. Aku tidak memintamu melupakan semua rasa lelahmu, aku cuma memintamu tinggal sebentar lagi, meminjamkanku satu hari lagi, dan lagi, untuk meyakinkanmu bahwa aku masih perempuan yang sama yang sangat mencintaimu, yang menyiapkan segalanya, dan yang tidak akan pernah lelah membuktikan bahwa kamu adalah satu-satunya rumah yang kuinginkan di dunia ini. Stay with me, just for today, my love. Let’s celebrate our two years, let’s pretend the world outside can wait, and let me hold your hand one more time as your girlfriend, as your Raara, as yours."],
["Tempat pulang","Kalau duniaku selama ini penuh dengan suara bising yang melelahkan, maka mencintaimu adalah satu-satunya tempat paling tenang di mana aku selalu ingin pulang. I love the way you exist in my life so effortlessly, menjadi alasan di balik setiap senyum terbahagia saat membaca pesan darimu, menjadi debar hangat yang menenangkan setiap kali hari-hariku terasa terlalu berat. Rasanya tidak pernah ada satu hari pun di mana perasaanku surut; justru seiring waktu berjalan, cinta ini tumbuh semakin akar, semakin dalam, dan semakin melekat pada setiap bagian dari diriku. Kamu bukan cuma seseorang yang singgah, tapi kamu adalah rumah, semesta, dan tempat paling aman di mana aku bisa jadi diriku apa adanya tanpa takut dihakimi."],
["Hal-hal kecil","Terima kasih ya, Sayang, untuk setiap hal kecil yang selalu kamu lakukan dengan tulus tanpa menuntut balasan. Dari obrolan panjang kita di setiap malam yang melelahkan, suara khasmu di telepon yang selalu jadi pengantar tidurku, tawa receh kita di dalam mobil, sampai kebaikan-kebaikan sederhana yang kamu curahkan untuk menjaga hari-hariku tetap hangat. You have been nothing short of amazing, menjadi kekasih terbaik yang selalu sabar menghadapi segala kurangku, dan merangkulku dengan cara paling lembut yang pernah kukenal. Aku mencintaimu bukan karena kamu harus sempurna, tapi karena setiap inci dari dirimu. Cara kamu berpikir, cara kamu tertawa, bahkan cara kamu menatapku, adalah hal paling berharga yang Tuhan titipkan dalam hidupku."],
["Selamat anniversary","Dan di hari istimewa kita ini, ketika kita merayakan dua tahun perjalanan penuh cinta dan cerita, aku ingin kamu tahu betapa bersyukurnya aku karena semesta pernah berbaik hati mempertemukan kita. Selamat Anniversary Kedua, my home, my universe. Like water in a desert, flower in the concrete, sun to the moon, an angel in a nightmare, air in my lungs, veins to my blood, the arrow through my heart. Thank you for everything, really. Maaf untuk semuanya, dan terima kasih karena pernah mencintaiku semasa putih abu sampai semuanya menjadi rumit sekarang. I love you, always have, and God knows I always will."],["Kabar dariku", "Kalau ada hal yang mengganggumu di sana, never hesitate to message me and say you’re not doing okay ya. I’ll always keep the room for you. I’m here patiently and always longing for you ya. Last update on me was kamu jadi calon ketua atau koor Kastrat ya? Keren banget, jujur, and I can’t wait for the result or an update! Dengan senang hati aku selalu berdoa buat kebaikanmu di sana. I started fixing my sholat and being honest with my mom and dad. I’m doing well here, just not with my mind. There is no “sometimes”, the whole time I’m thinking about you in the back of my mind. Kadang bikin sakit kepala sih, banget, tapi gapapa, anyway, that’s what I deserve, right? After all. And I hope you’re also well, jangan sedih dan jangan menyesal soal keputusan yang kamu ambil, it’s okay, it takes time for prioritizing yourself, etc. So that’s it, jangan lupa makan pagi, sarapan jangan di-skip when you have time, jangan lupa juga untuk selalu beli makanan terbaik untukmu ya. Cukup menahan dan berkorbannya, udah waktunya kamu berhenti sejenak dan biarin aku ngelakuin hal yang selalu kamu dambakan, atau mungkin aku juga dambakan? Haha, entah ya, aku agak ngelindur nih. Spend your time with your friends, try every corner of the places you haven’t been, any, any, any kinds, and if you have the will, try to tell me what you’ve done ya :D I’m here always, longing for you, still. ILSM", [0, 1]],["Kalau kita mulai lagi", "I’d rather start ours again, fix the problems, go on dates, bills on me, work a billion times on winning you over again, rather than start all over with a stranger. I will gladly do anything just so I don’t end up with anyone else but you. Only we know how much we need each other. I’ll always feel it when I realize I can’t spend a day without feeling weird and nauseous. I’ll always feel it on the night before every date. I’ll always feel it when my phone dies. I’ll always feel it on a walk, a drive alone. I’ll always feel it while sitting in the forum. I’ll always feel it after the funniest laugh, jokes, night ever. I’ll always feel it after hearing some specific songs of ours. I will live a life full of distraction and avoidance. Forever is not a season of love, and the season of love was not meant to be forever; some things are meant to be a phase, and some phases are meant to be gotten back when it comes to the right time, right mind, and right soul. OR I probably won’t stay very long, but you are the life I needed all along.", [2, 3]],["Cerita yang menunggu", "The story’s waiting; she doesn’t know if they’ll ever find their way back to each other, but HE surely knows when. And he can always change. So when they do, she doesn’t want to come back to someone he used to love. That person is gone. Went far away beneath the ocean of sorrows. She wants to come back knowing how to genuinely love him, not by possessing nor obsessing, to make better decisions, to be more patient than he knew, understanding other people first and filled with honesty and care. She wants to make the man feel safe and sound in her embrace, not because she’s asking him to forget what happened, not anymore, but because she already understands more than enough what she had, almost, lost. She still hopes and prays that someday he will let her love him again, and when that day comes, she will make sure he never has to question how much he means to her and how much she loves him. She’s not only fixing her bad habits toward humans, but with her God as well. Thinking about him makes her only half-sleep, so when she wakes up late at night, she stops opening the room chat and chats with her God instead. Praying and fasting for herself, for her parents, for every person she has loved, and for the man she yearns for, that every step they both walked in will be blessed and lead them to each other at the holiest path that their God blessed. Now his mother’s prayers reach beyond and beyond because someone else’s prayers are helping them up, for always. ILSM, M. Azka Musyaffa, the Savior of the Shattered, may you be healed and come heal our wounds, like your name has ever meant.<br><br><i style=\"color:var(--blue)\">— Raara</i>", [4, 5]]
];
